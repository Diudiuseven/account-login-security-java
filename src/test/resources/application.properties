server.port=0
# 测试使用独立临时数据目录，避免污染
security.store-dir=${java.io.tmpdir}/sec-test-${random.uuid}
security.password-hash-iterations=1000
security.fail-window-ms=600000
security.max-failures=5
security.lock-duration-ms=2000
security.ip-fail-window-ms=600000
security.ip-max-failures=20
security.session-ttl-ms=1800000
security.session-strategy=KICK_OUT
security.bootstrap-admin-username=admin
security.bootstrap-admin-password=admin123
